<h1>Калькулятор 4 Реактивные формы</h1>
<p> Не забыть импортировать ReactiveFormsModule в ts файле</p>

<input type="number" [formControl]="x"/>
<input type="number" [formControl]="y"/>

<div class = "buttons">
    <button (click)="plus()"  >+</button>
    <button (click)="minus()" >-</button>
</div>
<input type="number" [formControl]="result"/>
