<h1>Одиночные карточки</h1>

@let p = portrait();
<div class="portrait">
    <div class="info">
        <span class="name">{{ p.name }}</span>
        <span>{{ p.short_description }}</span>
        <span>{{ p.description }}</span>
    </div>
    <div class="photo">
        <img src="photos/{{ p.photo }}" />
        <div class="buttons">
            <button (click)="back()">Назад</button>
            <button (click)="forward()">Вперед</button>
        </div>
    </div>
</div>
